name: Build tandem.cpp Windows CUDA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout tandem.cpp patch repo
        uses: actions/checkout@v4

      - name: Setup CUDA
        uses: Jimver/cuda-toolkit@v0.2.34
        with:
          #cuda: '12.6.3'
          cuda: '13.2.0'
      - name: Clone llama.cpp and apply patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dir
          $BASE_COMMIT = (Get-Content BASE_COMMIT -Raw).Trim()
          Write-Host "Base commit: $BASE_COMMIT"
          git clone https://github.com tandem
          cd tandem
          git checkout $BASE_COMMIT
          git apply ../tandem.patch

      - name: Configure CMake
        working-directory: tandem
        run: cmake -B build -DGGML_CUDA=ON -DLLAMA_CURL=OFF -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;90"

      - name: Build Release
        working-directory: tandem
        run: cmake --build build --config Release -j 4 --target llama-server llama-cli

      - name: Package binaries
        run: |
          mkdir release_bin
          Get-ChildItem -Path tandem\build -Recurse -Include *.exe,*.dll | Copy-Item -Destination release_bin\

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tandem-cpp-windows-cuda
          path: release_bin/
