name: Build tandem.cpp Windows CUDA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout tandem.cpp patch repo
        uses: actions/checkout@v4

      - name: Setup CUDA
        uses: Jimver/cuda-toolkit@v0.2.34
        with:
          cuda: '12.6.3'

      # ВАЖНО: Мы УДАЛИЛИ шаг Setup MSVC environment, 
      # так как будем использовать генератор Visual Studio, который сам всё найдет.

      - name: Clone llama.cpp and apply patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "BASE_COMMIT")) { throw "File BASE_COMMIT not found!" }
          $BASE_COMMIT = (Get-Content BASE_COMMIT -Raw).Trim()
      
          $REPO_URL = "https://github.com/ggml-org/llama.cpp"          
          git clone $REPO_URL tandem
          cd tandem
          git checkout $BASE_COMMIT
          # Используем --ignore-whitespace для избежания ошибок из-за CRLF/LF
          git apply ../tandem.patch --ignore-whitespace

      - name: Configure CMake
        working-directory: tandem
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_CUDA=ON `
            -DLLAMA_CURL=OFF `
            -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;90" `
            -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler"

      - name: Build Release
        working-directory: tandem
        run: |
          # При использовании генератора VS важно указывать --config Release
          cmake --build build --config Release -j 4 --target llama-server llama-cli

      - name: Install (Collect all DLLs and EXEs)
        working-directory: tandem
        run: |
          # Это самый надежный способ собрать всё необходимое для запуска в одну папку
          cmake --install build --prefix release_bin --config Release

      - name: Package binaries
        shell: pwsh
        run: |
          # Собираем все файлы из папки установки в один плоский список (если нужно)
          if (-not (Test-Path "release_bin")) { mkdir release_bin }
          Get-ChildItem -Path release_bin -Recurse | Copy-Item -Destination release_bin\ -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tandem-cpp-windows-cuda
          path: release_bin/
