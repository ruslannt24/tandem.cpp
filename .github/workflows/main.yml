name: Build tandem.cpp (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          choco install cmake make git

      - name: Build DLL for LM Studio
        shell: cmd
        run: |
          make CC=cl CXX=cl ^
              GGML_SHARED=1 ^
              TANDEM_LMSTUDIO=1 ^
              -j%NUMBER_OF_PROCESSORS%

      - name: Find and upload DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter "*.dll" | Select-Object -First 1
          if ($dll) {
            Write-Host "Found DLL: $($dll.FullName)"
            Copy-Item $dll.FullName tandem.dll
          } else {
            throw "No DLL found after build"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: tandem-windows-x64
          path: tandem.dll

  release-dll:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tandem-windows-x64

      - uses: softprops/action-gh-release@v1
        with:
          files: tandem-windows-x64/tandem.dll
