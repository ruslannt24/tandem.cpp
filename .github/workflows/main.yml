name: Build tandem.cpp (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Посмотреть структуру репозитория
      - name: List files
        shell: cmd
        run: dir /s /b *.txt *.cmake Makefile build.sh CMakeLists.txt 2>nul || echo "No build files found"

      - name: Show root directory
        shell: cmd
        run: dir
