name: Build tandem.cpp (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        run: choco install cmake --install-args '"ADD_CMAKE_TO_PATH=1"'

      - name: Configure CMake
        shell: cmd
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release ^
              -DBUILD_SHARED_LIBS=ON ^
              -DTANDEM_BUILD_LMSTUDIO=ON

      - name: Build
        shell: cmd
        run: |
          cd build
          cmake --build . --config Release

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: tandem-windows-x64
          path: build/Release/tandem.dll

  # При создании релиза — прикрепить DLL к нему
  release-dll:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tandem-windows-x64

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: tandem-windows-x64/tandem.dll
