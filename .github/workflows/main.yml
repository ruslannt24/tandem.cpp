name: Build tandem.cpp Windows CUDA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CUDA
        uses: Jimver/cuda-toolkit@v0.2.15
        with:
          cuda: '12.6.0'

      - name: Configure CMake
        run: cmake -B build -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;90;120"

      - name: Build Release
        run: cmake --build build --config Release -j 4

      - name: Package binaries
        run: |
          mkdir release_bin
          copy build\bin\Release\*.exe release_bin\
          copy build\bin\Release\*.dll release_bin\

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tandem-cpp-windows-cuda
          path: release_bin/
